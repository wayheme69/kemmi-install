<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>KEMMI Avatar</title>
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;background:#dddfe4;overflow:hidden;}
  #idlevid,#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  #idlevid{z-index:1;}                                               /* vidéo de repos qui RESPIRE (boucle fluide) */
  #video{z-index:2;opacity:0;transition:opacity .45s ease;background:transparent;}  /* live : respire + parle */
  #st{position:absolute;top:0;left:0;right:0;text-align:center;font:600 12px -apple-system,sans-serif;
      color:#fff;background:rgba(0,0,0,.5);padding:3px 0;z-index:9;transition:opacity .4s;}
</style>
</head>
<body>
<video id="idlevid" src="avatar_idle_v8.mp4" poster="avatar_poster_v8.jpg" preload="auto" loop muted autoplay playsinline></video>
<video id="video" autoplay playsinline></video>
<div id="st">init…</div>
<script>
  const TOKEN_URL = "https://erclbrmnusivjmevwnsq.supabase.co/functions/v1/anam-session-token";
  const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyY2xicm1udXNpdmptZXZ3bnNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1NTEwNzEsImV4cCI6MjA4MjEyNzA3MX0.ul9cNCTscgfVR63PA802Yusu6nRH1289ruMwaoZImLw";
  const MAX_SESSION_MS = 150000;
  const SPEAK_DELAY_MS = 1100;   // latence lip-sync Anam : on décale le texte pour qu'il colle au moment où le son SORT

  let sdk = null, client = null, connecting = false, pendingAudio = null, maxTimer = null, audioCtx = null, wantConnect = false;
  let liveShown = false, statsTimer = null, statsRAF = false;
  const $ = id => document.getElementById(id);

  // ─── MOUCHARD FORMAT (version SÛRE, lecture seule) ───────────────────────────
  // On NE wrappe PAS le constructeur (ça cassait la vidéo sur iOS). On pose juste une
  // étiquette sur UNE méthode (setRemoteDescription) pour récupérer la connexion (this),
  // puis on appelle l'originale TELLE QUELLE. Ensuite getStats() = lecture pure du format
  // reçu (codec vidéo H264/VP8, résolution, i/s, débit ; codec audio Opus + Hz). -> Journal.
  let capturedPC = null, reportDone = false, lastV = null;
  try {
    const proto = (window.RTCPeerConnection || window.webkitRTCPeerConnection).prototype;
    const _srd = proto.setRemoteDescription;
    proto.setRemoteDescription = function(){ capturedPC = this; return _srd.apply(this, arguments); };
  } catch(e){}
  async function reportFormat(){
    if (!capturedPC){ notify("log","FORMAT: connexion non captée"); return; }
    try {
      const stats = await capturedPC.getStats();
      const codecs = {}; let vIn=null, aIn=null;
      stats.forEach(r=>{ if (r.type==='codec') codecs[r.id]=r; });
      stats.forEach(r=>{
        if (r.type==='inbound-rtp' && (r.kind==='video'||r.mediaType==='video')) vIn=r;
        if (r.type==='inbound-rtp' && (r.kind==='audio'||r.mediaType==='audio')) aIn=r;
      });
      if (vIn){
        const c = codecs[vIn.codecId];
        let line = `VIDÉO reçue: ${c?c.mimeType:'?'}  ${vIn.frameWidth||'?'}x${vIn.frameHeight||'?'}  ${Math.round(vIn.framesPerSecond||0)} i/s`;
        if (lastV && vIn.bytesReceived!=null && lastV.b!=null && vIn.timestamp>lastV.t){
          const kbps = Math.round((vIn.bytesReceived-lastV.b)*8/1000 / ((vIn.timestamp-lastV.t)/1000));
          line += `  ~${kbps} kbps`;
        }
        lastV = { b: vIn.bytesReceived, t: vIn.timestamp };
        notify("log", line);
      } else notify("log","VIDÉO: pas encore de stats");
      if (aIn){ const c = codecs[aIn.codecId]; notify("log", `AUDIO reçu: ${c?c.mimeType:'?'}  ${c?c.clockRate:'?'} Hz`); }
      else notify("log","AUDIO: pas encore de stats");
    } catch(e){ notify("log","FORMAT erreur: "+(e.message||e)); }
  }

  function setStatus(t){ try { const e=$('st'); e.textContent=t; e.style.opacity=1; } catch(e){} notify("log", t); }
  function hideStatusSoon(){ setTimeout(()=>{ try{ $('st').style.opacity=0; }catch(e){} }, 1500); }
  function showVideo(on){
    liveShown = on;
    try { $('video').style.opacity = on ? 1 : 0; } catch(e){}
    try {
      const idle = $('idlevid');
      if (on){
        // après le fondu : on met en PAUSE la vidéo repos (cachée sous le live) -> 1 SEULE vidéo décodée -> fluide
        setTimeout(()=>{ if (liveShown && idle){ idle.pause(); notify("log","repos en pause (1 seule vidéo décodée)"); } }, 600);
        startStats();
        if (!reportDone){ reportDone = true; setTimeout(reportFormat, 2500); setTimeout(reportFormat, 5000); }
      } else {
        if (idle) idle.play().catch(()=>{});   // live fini -> la repos respire à nouveau
        stopStats();
      }
    } catch(e){}
  }
  // Compteur d'images RÉELLEMENT affichées (requestVideoFrameCallback -> marche pour le WebRTC).
  // fps stable ~25-30 = fluide ; fps qui chute = saccade. "perdues" = images sous la cible 25/s.
  function startStats(){
    stopStats();
    const v = $('video');
    if (!v || !v.requestVideoFrameCallback){ notify("log","rVFC non supporté -> pas de mesure fps"); return; }
    statsRAF = true;
    let count = 0, t0 = performance.now(), totalLow = 0;
    const onFrame = (now) => {
      count++;
      if (now - t0 >= 1000){
        const fps = Math.round(count * 1000 / (now - t0));
        count = 0; t0 = now;
        const perdues = Math.max(0, 25 - fps);   // sous 25 images/s = ça saccade
        totalLow += perdues;
        notify("stats", JSON.stringify({ fps: fps, perdues: perdues, total_perdues: totalLow }));
      }
      if (statsRAF && v.requestVideoFrameCallback) v.requestVideoFrameCallback(onFrame);
    };
    v.requestVideoFrameCallback(onFrame);
  }
  function stopStats(){ statsRAF = false; try { if (statsTimer){ clearInterval(statsTimer); statsTimer = null; } } catch(e){} }
  function notify(type, data){ try { window.webkit?.messageHandlers?.kemmi?.postMessage(JSON.stringify({type, data: data||""})); } catch(e){} }
  function b64ToBytes(b64){ const bin=atob(b64), n=bin.length, u=new Uint8Array(n); for(let i=0;i<n;i++)u[i]=bin.charCodeAt(i); return u; }
  function getCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)({ sampleRate: 24000 }); return audioCtx; }

  async function getToken(){
    const r = await fetch(TOKEN_URL, { method:"POST", headers:{ Authorization:`Bearer ${ANON}`, "Content-Type":"application/json" }});
    const j = await r.json();
    if (!j.sessionToken) throw new Error("token: " + JSON.stringify(j).slice(0,80));
    return j.sessionToken;
  }

  // Décode NOTRE son (mp3/aac) -> PCM 24kHz mono Int16 -> on le pousse à Anam (lip-sync).
  function feedAudio(){
    if (!pendingAudio || !client) return;
    const b64 = pendingAudio; pendingAudio = null;
    try {
      setStatus("5·envoi audio…");
      const pcm = b64ToBytes(b64);              // PCM brut 24kHz 16-bit mono -> AUCUN décodage
      const stream = client.createAgentAudioInputStream({ encoding:'pcm_s16le', sampleRate:24000, channels:1 });
      const CHUNK_MS = 200;
      const CHUNK = Math.floor(24000 * CHUNK_MS / 1000) * 2;   // 0.2s en octets (16-bit mono)
      let off = 0, first = true;
      const sendNext = () => {
        if (!client) return;
        if (off >= pcm.length){ try{ stream.endSequence(); }catch(e){} return; }
        try { stream.sendAudioChunk(pcm.subarray(off, off + CHUNK)); }
        catch(e){ setStatus("ERR audio: "+(e.message||e)); notify("error", String(e)); return; }
        off += CHUNK;
        if (first){ first = false;
          const v=$('video'); v.muted=false; v.volume=1.0; v.play().catch(()=>{});
          showVideo(true); setStatus("EN DIRECT ✓"); hideStatusSoon();
          setTimeout(()=>notify("speaking"), SPEAK_DELAY_MS);   // texte ~ quand le son sort vraiment (anti-décalage)
        }
        setTimeout(sendNext, CHUNK_MS * 0.9);    // au rythme réel (léger avance) -> pas de rafale, plus fluide
      };
      sendNext();
    } catch(e){ setStatus("ERR audio: " + (e.message||e)); notify("error", String(e)); }
  }

  async function connect(retried){
    if (connecting || client) return;
    if (!sdk){ setStatus("SDK pas prêt…"); return; }
    connecting = true;
    try {
      setStatus("1·token…");
      const token = await getToken();
      setStatus("2·client…");
      client = sdk.createClient(token, { disableInputAudio: true });
      // On envoie le son SEULEMENT quand la vidéo joue vraiment (session pleinement prête) -> marche au 1er message.
      try { client.addListener('VIDEO_PLAY_STARTED', ()=>{ const v=$('video'); v.muted=false; v.volume=1.0; v.play().catch(()=>{}); showVideo(true); notify("playing"); feedAudio(); }); } catch(e){}
      try { client.addListener('CONNECTION_CLOSED', ()=>{ showVideo(false); notify("closed"); client=null; }); } catch(e){}
      setStatus("3·stream…");
      await Promise.race([
        client.streamToVideoElement('video'),
        new Promise((_,rej)=> setTimeout(()=>rej(new Error("stream timeout 20s")), 20000))
      ]);
      setStatus("4·connecté (attente vidéo…)");
      clearTimeout(maxTimer); maxTimer = setTimeout(()=> window.kemmiStop(), MAX_SESSION_MS);
      notify("ready");
      // filet de sécurité : si VIDEO_PLAY_STARTED ne se déclenche pas, on pousse le son après 1,8s
      setTimeout(()=>{ if (pendingAudio && client) feedAudio(); }, 1800);
    } catch(e){
      const msg = String(e.message||e);
      try { if (client) await client.stopStreaming(); } catch(_){}   // ferme proprement l'éventuelle session
      client = null; connecting = false;
      // 1 SEULE session à la fois : si "concurrency/limit", on attend qu'elle se ferme + on réessaie UNE fois.
      if (!retried && /concurren|limit reached|too many|in use|already/i.test(msg)){
        setStatus("session occupée, réessai dans 4s…");
        setTimeout(()=>{ if (pendingAudio || wantConnect) connect(true); }, 4000);
        return;
      }
      setStatus("ERR connect: " + msg); notify("error", msg);
      return;
    }
    connecting = false;
  }

  // L'app envoie NOTRE son (base64 mp3/aac d'OpenAI TTS) -> elle le dit avec lip-sync.
  window.kemmiSpeakAudio = async function(base64audio){
    pendingAudio = base64audio;
    if (!sdk){ setStatus("chargement…"); return; }
    if (client){ await feedAudio(); }
    else if (!connecting){ await connect(); }
  };

  // PRÉ-CONNEXION (warm-up) : ouvre la session AVANT qu'elle parle -> 1er message fluide.
  window.kemmiConnect = function(){
    wantConnect = true;
    if (sdk && !client && !connecting) connect();
  };

  window.kemmiStop = async function(){
    clearTimeout(maxTimer); showVideo(false);
    try { if (client) await client.stopStreaming(); } catch(e){}
    client = null; pendingAudio = null; notify("closed");
  };

  // Force la lecture de la vidéo de repos (iOS WKWebView : l'autoplay seul est parfois ignoré -> elle restait figée).
  function startIdle(){ try{ const v=$('idlevid'); if(v){ v.muted=true; v.loop=true; const p=v.play(); if(p&&p.catch) p.catch(()=>{}); } }catch(e){} }
  startIdle();
  [300, 900, 2000, 4000].forEach(d => setTimeout(startIdle, d));
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) startIdle(); });

  (async () => {
    setStatus("chargement…");
    try {
      sdk = await import("https://esm.sh/@anam-ai/js-sdk");
      setStatus("prêt"); hideStatusSoon(); notify("loaded");
      if (pendingAudio || wantConnect) await connect();
    } catch(e){ setStatus("ERREUR SDK: " + e.message); notify("error", "sdk:" + String(e)); }
  })();
</script>
</body>
</html>
