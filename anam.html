<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>KEMMI Avatar</title>
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;background:#e2e5e8;overflow:hidden;}
  #poster,#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  #poster{z-index:1;}                                                /* sa photo, au repos */
  #video{z-index:2;opacity:0;transition:opacity .45s ease;background:transparent;}  /* avatar quand elle parle */
  #st{position:absolute;top:0;left:0;right:0;text-align:center;font:700 15px -apple-system,sans-serif;
      color:#fff;background:rgba(0,0,0,.8);padding:8px 0;z-index:9;transition:opacity .4s;}
</style>
</head>
<body>
<img id="poster" src="avatar_poster.jpg" alt=""/>
<video id="video" autoplay playsinline></video>
<div id="st">init…</div>
<script>
  const TOKEN_URL = "https://erclbrmnusivjmevwnsq.supabase.co/functions/v1/anam-session-token";
  const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVyY2xicm1udXNpdmptZXZ3bnNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY1NTEwNzEsImV4cCI6MjA4MjEyNzA3MX0.ul9cNCTscgfVR63PA802Yusu6nRH1289ruMwaoZImLw";
  const MAX_SESSION_MS = 150000;

  let sdk = null, client = null, connecting = false, pendingAudio = null, maxTimer = null, audioCtx = null;
  const $ = id => document.getElementById(id);

  function setStatus(t){ try { const e=$('st'); e.textContent=t; e.style.opacity=1; } catch(e){} }
  function hideStatusSoon(){ setTimeout(()=>{ try{ $('st').style.opacity=0; }catch(e){} }, 1500); }
  function showVideo(on){ try { $('video').style.opacity = on ? 1 : 0; } catch(e){} }
  function notify(type, data){ try { window.webkit?.messageHandlers?.kemmi?.postMessage(JSON.stringify({type, data: data||""})); } catch(e){} }
  function b64ToBytes(b64){ const bin=atob(b64), n=bin.length, u=new Uint8Array(n); for(let i=0;i<n;i++)u[i]=bin.charCodeAt(i); return u; }
  function getCtx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)({ sampleRate: 24000 }); return audioCtx; }

  async function getToken(){
    const r = await fetch(TOKEN_URL, { method:"POST", headers:{ Authorization:`Bearer ${ANON}`, "Content-Type":"application/json" }});
    const j = await r.json();
    if (!j.sessionToken) throw new Error("token: " + JSON.stringify(j).slice(0,80));
    return j.sessionToken;
  }

  // Décode NOTRE son (mp3/aac) -> PCM 24kHz mono Int16 -> on le pousse à Anam (lip-sync).
  async function feedAudio(){
    if (!pendingAudio || !client) return;
    const b64 = pendingAudio; pendingAudio = null;
    try {
      setStatus("5·envoi audio…");
      const pcm = b64ToBytes(b64);              // PCM brut 24kHz 16-bit mono -> AUCUN décodage (fini le blocage 1er message)
      const stream = client.createAgentAudioInputStream({ encoding:'pcm_s16le', sampleRate:24000, channels:1 });
      const CHUNK = 48000;                      // ~1s par paquet
      for (let i=0;i<pcm.length;i+=CHUNK){ stream.sendAudioChunk(pcm.subarray(i, i+CHUNK)); }
      stream.endSequence();
      const v=$('video'); v.muted=false; v.volume=1.0; v.play().catch(()=>{});
      showVideo(true); setStatus("EN DIRECT ✓"); hideStatusSoon();
    } catch(e){ setStatus("ERR audio: " + (e.message||e)); notify("error", String(e)); }
  }

  async function connect(){
    if (connecting || client) return;
    if (!sdk){ setStatus("SDK pas prêt…"); return; }
    connecting = true;
    try {
      setStatus("1·token…");
      const token = await getToken();
      setStatus("2·client…");
      client = sdk.createClient(token, { disableInputAudio: true });
      try { client.addListener('VIDEO_PLAY_STARTED', ()=>{ const v=$('video'); v.muted=false; v.volume=1.0; v.play().catch(()=>{}); showVideo(true); notify("playing"); }); } catch(e){}
      try { client.addListener('CONNECTION_CLOSED', ()=>{ showVideo(false); notify("closed"); client=null; }); } catch(e){}
      setStatus("3·stream…");
      await Promise.race([
        client.streamToVideoElement('video'),
        new Promise((_,rej)=> setTimeout(()=>rej(new Error("stream timeout 20s")), 20000))
      ]);
      setStatus("4·connecté");
      clearTimeout(maxTimer); maxTimer = setTimeout(()=> window.kemmiStop(), MAX_SESSION_MS);
      notify("ready");
      await feedAudio();                                           // un son attendait -> on le pousse
    } catch(e){ setStatus("ERR connect: " + (e.message||e)); notify("error", String(e)); client = null; }
    connecting = false;
  }

  // L'app envoie NOTRE son (base64 mp3/aac d'OpenAI TTS) -> elle le dit avec lip-sync.
  window.kemmiSpeakAudio = async function(base64audio){
    pendingAudio = base64audio;
    if (!sdk){ setStatus("chargement…"); return; }
    if (client){ await feedAudio(); }
    else if (!connecting){ await connect(); }
  };

  window.kemmiStop = async function(){
    clearTimeout(maxTimer); showVideo(false);
    try { if (client) await client.stopStreaming(); } catch(e){}
    client = null; pendingAudio = null; notify("closed");
  };

  (async () => {
    setStatus("chargement…");
    try {
      sdk = await import("https://esm.sh/@anam-ai/js-sdk");
      setStatus("prêt"); hideStatusSoon(); notify("loaded");
      if (pendingAudio) await connect();
    } catch(e){ setStatus("ERREUR SDK: " + e.message); notify("error", "sdk:" + String(e)); }
  })();
</script>
</body>
</html>
